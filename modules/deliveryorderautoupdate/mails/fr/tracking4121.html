        <style> @media only screen and (max-width: 300px){
                body {
                    width:218px !important;

                span.title{font-size:20px !important;line-height: 23px !important}
                span.subtitle{font-size: 14px !important;line-height: 18px !important;padding-top:10px !important;display:block !important;}
                td.box p{font-size: 12px !important;font-weight: bold !important;}
                .table-recap table, .table-recap thead, .table-recap tbody, .table-recap th, .table-recap td, .table-recap tr {
                    display: block !important;

                .table-recap{width: 200px!important;}
                .table-recap tr td, .conf_body td{text-align:center !important;}
                .address{display: block !important;margin-bottom: 10px !important;}
                .space_address{display: none !important;}
            }
    @media only screen and (min-width: 301px) and (max-width: 500px) {
                body {width:308px!important;margin:auto!important;}
                .table {width:285px!important;margin:auto!important;}
                .logo, .titleblock, .linkbelow, .box, .footer, .space_footer{width:auto!important;display: block!important;}

                    display: block !important;
                }
                .table-recap{width: 295px !important;}
                .table-recap tr td, .conf_body td{text-align:center !important;}

            }
    @media only screen and (min-width: 501px) and (max-width: 768px) {
                body {width:478px!important;margin:auto!important;}
                .table {width:450px!important;margin:auto!important;}
                .logo, .titleblock, .linkbelow, .box, .footer, .space_footer{width:auto!important;display: block!important;}
            }
    @media only screen and (max-device-width: 480px) {
                body {width:308px!important;margin:auto!important;}
                .table {width:285px;margin:auto!important;}
                .logo, .titleblock, .linkbelow, .box, .footer, .space_footer{width:auto!important;display: block!important;}

                .table-recap{width: 295px!important;}
                .table-recap tr td, .conf_body td{text-align:center!important;}
                .address{display: block !important;margin-bottom: 10px !important;}
                .space_address{display: none !important;}
            }

    .left-content .title{
        background:#99CCFF;
        text-transform:uppercase;
        font-size:12px;
        font-weight:bold;
        padding:5px;

        -webkit-box-align: space-between;
        -webkit-align-items: space-between;
        -ms-flex-align: space-between;
        justify-content: space-between;

        -webkit-box-align: center;
        -webkit-align-items: center;
        -ms-flex-align: center;
        align-items: center;
    }
    .tracking-box .step-list {
        overflow: auto;
    }
    .tracking-box .title {
        color:#fff;
    }
    .left-content .step-list .item-rows {
        display:flex;
        -webkit-box-align: center;
        -webkit-align-items: center;
        -ms-flex-align: center;
        align-items: center;
        padding:14px 0;
    }
    .left-content .step-list .item-rows .icon {
        position:relative;
    }
    .left-content .step-list .item-rows .icon span {
        width:45px;
        height:45px;
        line-height:46px;
        text-align:center;
        border-radius:50%;
        border:1px solid #ebebeb;
        position:relative;
        z-index:2;
        display:block;
        color:#fff;
    }
    .left-content .step-list .item-rows .icon:before {
        content:"";
        position:absolute;
        top:-15px;
        left:50%;
        height:calc(100% + 30px);
        width:2px;
        display:block;
        background:#ebebeb;
        z-index:1;
    }
    .left-content .step-list .item-rows .text {
        padding-left:15px;
    }
    .left-content .step-list .item-rows .text span {
        display:block;
    }

    .left-content .title span{
        display:inline-block;
        background:#008000;
        padding:5px;
        border-radius:5px;
    }
    .tracking-box .step-list .action-truck,.tracking-box .step-list .action-truck8, .dl_dashboard .action-truck, .dl_dashboard .action-truck8{
        transform: scale(-1, 1);
    }

    .step_text {
        font-weight: bold;
    }
    .tracking-box .row {
        margin: 0!important;
    }
    .tracking-box {
        max-width: unset!important;
    }
</style>
