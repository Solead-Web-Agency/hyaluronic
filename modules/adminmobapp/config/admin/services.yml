services:
  adminmobapp.module:
    class: adminmobapp
    public: true
    factory: ["Module", "getInstanceByName"]
    arguments:
      - "adminmobapp"

  adminmobapp.context:
    class: Context
    public: true
    factory: ["Context", "getContext"]

  #####################
  # PS Account
  adminmobapp.ps_accounts_installer:
    class: 'PrestaShop\PsAccountsInstaller\Installer\Installer'
    public: true
    arguments:
      - "7.0"

  adminmobapp.ps_accounts_facade:
    class: 'PrestaShop\PsAccountsInstaller\Installer\Facade\PsAccounts'
    public: true
    arguments:
      - "@adminmobapp.ps_accounts_installer"

  #####################
  # PS Billing
  adminmobapp.ps_billings_context_wrapper:
    class: 'PrestaShopCorp\Billing\Wrappers\BillingContextWrapper'
    arguments:
      - "@adminmobapp.ps_accounts_facade"
      - "@adminmobapp.context"
      - false # if true you are in sandbox mode, if false or empty not in sandbox

  adminmobapp.ps_billings_facade:
    class: 'PrestaShopCorp\Billing\Presenter\BillingPresenter'
    public: true
    arguments:
      - "@adminmobapp.ps_billings_context_wrapper"
      - "@adminmobapp.module"

  
  adminmobapp.ps_billings_service:
    class: PrestaShopCorp\Billing\Services\BillingService
    public: true
    arguments:
      - "@adminmobapp.ps_billings_context_wrapper"
      - "@adminmobapp.module"
