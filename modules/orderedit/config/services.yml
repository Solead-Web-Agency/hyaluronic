services:
  OrderEdit_controller:
    class: OrderEdit\Controller\OrderEditController
    # but that service is still available as @custom_controller.inner
    decorates: PrestaShopBundle\Controller\Admin\Sell\Order\OrderController
    # pass the old service as an argument
    arguments: ['@OrderEdit_controller.inner']

  order_edit.order_edit_add_product_to_order_handler:
    class: 'OrderEdit\CommandHandler\OrderEditAddProductToOrderHandler'
    decorates: 'prestashop.adapter.order.command_handler.add_product_to_order_handler'
    arguments:
      - '@translator'
      - '@prestashop.adapter.context_state_manager'
      - '@prestashop.adapter.order.amount.updater'
      - '@prestashop.adapter.order.product_quantity.updater'
      - '@prestashop.adapter.order.order_detail.updater'